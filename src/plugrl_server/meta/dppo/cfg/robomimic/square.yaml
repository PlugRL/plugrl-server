obs_dim: 23
low_dim_keys: ['robot0_eef_pos', 'robot0_eef_quat', 'robot0_gripper_qpos', 'object']
action_dim: 7
transition_dim: ${action_dim}
denoising_steps: 20
horizon_steps: 4
cond_steps: 1

model:
  _target_: dppo.model.diffusion.diffusion.DiffusionModel
  predict_epsilon: true
  denoised_clip_value: 1.0
  randn_clip_value: 3
  network:
    _target_: dppo.model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 32
    mlp_dims:
    - 1024
    - 1024
    - 1024
    cond_mlp_dims:
    - 512
    - 64
    residual_style: true
    cond_dim: ${obs_dim}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  cond_steps: ${cond_steps}
