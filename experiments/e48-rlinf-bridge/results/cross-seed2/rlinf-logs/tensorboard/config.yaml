actor:
  model:
    model_type: mlp_policy
    model_path: ''
    policy_setup: panda-qpos
    obs_dim: 17
    action_dim: 6
    num_action_chunks: 1
    hidden_dim: 256
    precision: '32'
    add_value_head: true
    is_lora: false
    lora_rank: 32
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: '32'
      reduce_dtype: '32'
      buffer_dtype: '32'
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 256
  global_batch_size: 1024
  seed: 2
  enable_offload: false
  optim:
    lr: 0.0003
    value_lr: 0.0003
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 0.5
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0
  tracer:
    enable: false
runner:
  task_type: embodied
  logger:
    log_path: /home/guangzhao/zuogou/plugrl/e48/cross-seed2/rlinf-logs
    project_name: rlinf
    experiment_name: plugrl_halfcheetah_ppo_mlp
    logger_backends:
    - tensorboard
  max_epochs: 100
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 20
  seq_length: 1
  max_prompt_length: 1
  resume_dir: null
  ckpt_path: null
  per_worker_log: false
  per_worker_log_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false
algorithm:
  update_epoch: 8
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 1.0
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 1.0
rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ''
    precision: '32'
  enable_torch_compile: false
  enable_cuda_graph: false
reward:
  use_reward_model: false
critic:
  use_critic_model: false
