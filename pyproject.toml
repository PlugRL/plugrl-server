[project]
name = "plugrl-server"
version = "0.1.0"
description = "PlugRL training server: policies, algorithms, and batched inference over WebSocket."
authors = [
    {name = "chenhao lu", email = "luch21@mails.tsinghua.edu.cn"}
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "websockets>=15.0.1,<16.0.0",
    "tyro>=0.9.32,<0.10.0",
    "loguru>=0.7.3,<0.8.0",
    "torch>=2.7.0,<2.8.0",
    "safetensors>=0.5.3,<0.6.0",
    "packaging>=25.0,<26.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "swanlab>=0.6.10,<0.7.0",
    "wandb>=0.22.0,<0.23.0",
    "plugrl-protocol @ git+https://github.com/PlugRL/plugrl-protocol.git@c7961da3ca050717ad3a01721f00afa1ed29bf47",
    "tensordict>=0.10.0,<0.11.0",
    "ray>=2.51.1,<3.0.0",
    "tensorboard>=2.20.0,<3.0.0",
    "tqdm>=4.67.1,<5.0.0",
]

[project.scripts]
plugrl-run-server = "plugrl_server.cli:main"
plugrl-run-server-ray = "plugrl_server.cli_ray:main"

[project.optional-dependencies]
dppo = [
    "dppo @ git+https://github.com/CTP314/dppo.git@89ac4169b3c145a54ce4dc2f8f55ef6cc8980b1c",
]
openpi = [
    "huggingface-hub<1.0",
    "safetensors<0.6.0",
    "lerobot @ git+https://github.com/huggingface/lerobot.git@ed83cbd4f2091a3e97cdd0c48cc657020c037240",
]
reinflow = [
    "reinflow @ git+https://github.com/CTP314/ReinFlow.git@1307057af17a065f4bfd752b1000558d0514da3f",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1,<5.0.0",
    "pytest>=8.4.2,<9.0.0",
]

[tool.pytest.ini_options]
# Without this, pytest walks into third_party/openpi and collects that
# submodule’s own test suite, whose dependencies are not installed here.
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["plugrl_server*"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
