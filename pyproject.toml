[project]
name = "plugrl-server"
version = "0.1.0"
description = ""
authors = [
    {name = "chenhao lu", email = "luch21@mails.tsinghua.edu.cn"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "websockets (>=15.0.1,<16.0.0)",
    "tyro (>=0.9.32,<0.10.0)",
    "torch (>=2.7.0,<2.8.0)",
    "safetensors (>=0.5.3,<0.6.0)",
    "packaging (>=25.0,<26.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "swanlab (>=0.6.10,<0.7.0)",
    "wandb (>=0.22.0,<0.23.0)",
    "plugrl-client @ git+https://github.com/PlugRL/plugrl-client.git",
    "tensordict (>=0.10.0,<0.11.0)",
    "ray (>=2.51.1,<3.0.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "tensorboard (>=2.20.0,<3.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
]

[tool.poetry.scripts]
plugrl-run-server = "plugrl_server.cli:main"
plugrl-run-server-ray = "plugrl_server.cli_ray:main"

[tool.poetry.group.dppo.dependencies]
dppo = {git = "https://github.com/CTP314/dppo.git"}

[tool.poetry.group.openpi.dependencies]
huggingface-hub = {version = "<1.0"}
safetensors = {version = "<0.6.0"}
lerobot = {git = "https://github.com/huggingface/lerobot.git", rev = "ed83cbd"}

[tool.poetry.group.reinflow.dependencies]
reinflow = {git = "https://github.com/CTP314/ReinFlow.git"}


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.5.1"

[tool.poetry]
packages = [{include = "plugrl_server", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
