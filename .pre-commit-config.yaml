# See https://pre-commit.com for more information
# Install: uv sync --group dev && uv run pre-commit install

# experiments/*/results* holds captured run logs. They are evidence, not
# source: a whitespace hook rewriting them would quietly alter the record.
exclude: '^(checkpoints/|pretrains/|swanlog/|third_party/|experiments/[^/]+/results[^/]*/|\.venv/|dist/|build/|\.mypy_cache/|\.pytest_cache/|\.ruff_cache/)'

default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        exclude: '^uv\.lock$'
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
